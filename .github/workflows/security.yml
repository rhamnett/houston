name: Security

# Trivy over the repository: vulnerable dependencies (Cargo.lock), committed
# secrets and workflow/config misconfigurations. Fails on MEDIUM and above,
# less what .trivyignore.yaml accepts (each with a reason and an expiry).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays: new advisories against unchanged code
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Not the trivy-action or setup-trivy actions: their tags were hijacked in
  # March 2026 (GHSA-69fq-xp46-6x23). One pinned, immutable release, checked
  # against its SHA-256 before it runs.
  TRIVY_VERSION: 0.76.0
  TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7

jobs:
  trivy:
    runs-on: ubuntu-latest # a tenth of the price of macOS, and Trivy doesn't care
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF to code scanning, once the repo is public
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Trivy (pinned, verified)
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "${TRIVY_SHA256}  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version
      - name: Scan
        run: >-
          trivy fs . --scanners vuln,secret,misconfig
          --severity MEDIUM,HIGH,CRITICAL --exit-code 1
          --ignorefile .trivyignore.yaml --no-progress
      - name: Report for code scanning
        if: always() && github.event.repository.visibility == 'public'
        run: >-
          trivy fs . --scanners vuln,secret,misconfig --format sarif
          --output trivy.sarif --ignorefile .trivyignore.yaml --no-progress
      - name: Upload to code scanning
        # Code scanning on a private repository needs GitHub Advanced Security.
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy
