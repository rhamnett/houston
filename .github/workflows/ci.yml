name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push replaces the run in progress: macOS minutes are expensive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, so build.rs can version the build (git describe)
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # A sandboxed Houston (its own data folder and port), flown over MCP and
      # REST. The runner's Keychain can't be used unattended, so with CI set the
      # sandbox keeps its secrets in a file in its data folder.
      - name: End-to-end
        timeout-minutes: 4
        run: cargo test --test e2e -- --ignored --nocapture
