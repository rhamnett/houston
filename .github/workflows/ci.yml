name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push replaces the run in progress: macOS minutes are expensive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The runner's login Keychain is locked, and Houston would wait on it
      # forever: give it an unlocked default Keychain of its own.
      - name: Unlocked Keychain
        run: |
          security create-keychain -p ci houston-ci.keychain
          security set-keychain-settings houston-ci.keychain
          security unlock-keychain -p ci houston-ci.keychain
          security list-keychains -d user -s houston-ci.keychain
          security default-keychain -d user -s houston-ci.keychain
          # Fail in seconds, not hours, if the Keychain still isn't usable.
          perl -e 'alarm 10; exec @ARGV' security add-generic-password -s houston.ci.probe -a probe -w ok -A
          perl -e 'alarm 10; exec @ARGV' security find-generic-password -s houston.ci.probe -a probe -w
      # A sandboxed Houston (its own data folder, Keychain service and port),
      # flown over MCP and REST.
      - name: End-to-end
        timeout-minutes: 4
        run: cargo test --test e2e -- --ignored --nocapture
