name: Release

# Push a tag that matches Cargo.toml's version to publish it:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1
          fi
      - run: cargo test
      - name: Bundle (universal)
        run: UNIVERSAL=1 ./bundle.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          cat > notes.md <<NOTES
          **Install:** unzip \`Houston-$version-macos.zip\`, move Houston.app to Applications and open it from the right-click menu the first time (it's ad-hoc signed, not notarised). Or: \`xattr -dr com.apple.quarantine /Applications/Houston.app\`.

          Universal (Apple silicon and Intel), macOS 12 or later. SHA-256 is in the \`.sha256\` file.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            "dist/Houston-$version-macos.zip" "dist/Houston-$version-macos.zip.sha256" \
            --title "Houston $version" --notes-file notes.md --generate-notes --verify-tag
