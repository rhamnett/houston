name: Release

# Every push to main works out the next version from the Conventional Commits
# since the last v* tag (scripts/conventional.sh): fix/perf a patch, feat a
# minor, a breaking change a major (a minor while 0.x). When there's nothing
# to release (docs, ci, chore...) it ends after one cheap Linux job; otherwise
# it tags, builds the universal app and publishes the release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in order; a newer push waits rather than racing for
# the same version number.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history, to read the commits since the last release
          persist-credentials: false
      - id: next
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
          range=$([ "$last" = v0.0.0 ] && echo HEAD || echo "$last..HEAD")
          version=$(git log -z --format=%B "$range" | scripts/conventional.sh next "$last")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### ${version:+Releasing v$version}${version:-Nothing to release} (last: $last)"
            git log -z --format=%B "$range" | scripts/conventional.sh notes
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: write # create the tag and the release
    env:
      HOUSTON_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test
      - name: Bundle (universal)
        run: |
          UNIVERSAL=1 ./bundle.sh
          test "$(dist/Houston.app/Contents/MacOS/houston --version)" = "houston $HOUSTON_VERSION"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
          range=$([ "$last" = v0.0.0 ] && echo HEAD || echo "$last..HEAD")
          {
            git log -z --format=%B "$range" | scripts/conventional.sh notes
            echo "**Install:** unzip \`Houston-$HOUSTON_VERSION-macos.zip\`, move Houston.app to Applications and open it from the right-click menu the first time (it's ad-hoc signed, not notarised). Or: \`xattr -dr com.apple.quarantine /Applications/Houston.app\`."
            echo
            echo "Universal (Apple silicon and Intel), macOS 12 or later. SHA-256 is in the \`.sha256\` file. Full changes: [$last...v$HOUSTON_VERSION](https://github.com/$GITHUB_REPOSITORY/compare/$last...v$HOUSTON_VERSION)"
          } > notes.md
          gh release create "v$HOUSTON_VERSION" \
            "dist/Houston-$HOUSTON_VERSION-macos.zip" "dist/Houston-$HOUSTON_VERSION-macos.zip.sha256" \
            --target "$GITHUB_SHA" --title "Houston $HOUSTON_VERSION" --notes-file notes.md
