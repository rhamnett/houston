[package]
name = "houston"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
block2 = "0.6"
chrono = "0.4"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSScreen",
    "NSSound",
    "NSWindow",
    "block2",
] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSString"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37.2"
tray-icon = "0.26.1"
ureq = { version = "3.5.0", features = ["json"] }
wry = "0.57.1"
